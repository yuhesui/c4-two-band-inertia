name: Exact verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run both exact verification methods
        run: python software/run_all.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  lean-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and independently type-check Lean certificates
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: true
          nanoda: false
      - name: Strict nanoda external type check
        working-directory: lean
        env:
          NANODA_ALLOW_SORRY: "false"
        run: bash run_nanoda.sh
